# NOTE: Minecraft 26.1+ ships unobfuscated with official Mojang names built in.
# Yarn mappings are discontinued for this version - deps.yarn_build below is
# unused by design and kept only so buildSrc's property lookups don't fail.
#
# fabric.loom.disableObfuscation=true (below) tells Architectury Loom itself to
# skip the whole remapping/mappings pipeline for this target - confirmed by
# reading LoomConfigurations.java and CompileConfiguration.java in the actual
# architectury-loom source (dev/1.13 branch, matching the pinned 1.13-SNAPSHOT):
# when this flag is set, the MAPPINGS configuration is never registered at all,
# so the earlier "Configuration 'mappings' has no dependencies" crash can't
# happen. This works on the existing stable Loom pin - no version bump needed.
# Fabric-only: the same source shows Forge/NeoForge explicitly throws
# UnsupportedOperationException when combined with this flag (not yet
# implemented upstream), so 26.2-neoforge stays blocked as before.
# See MIGRATION-26.2.md for full details and remaining source-level work.

fabric.loom.disableObfuscation=true

deps.forge_loader=
deps.neoforge_loader=26.2.0.50-beta
deps.neoforge_patch=[26.2]

deps.yarn_build=0
deps.fabric_loader=0.19.3
deps.fabric_version=0.155.2+26.2
deps.modmenu_version=15.0.0
deps.elytra_recast=2.5.1

loom.platform=fabric
